[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "designcraft-brochure"
version = "0.1.0"
description = "Jev-directed brochure agent that drives DesignCraft through its control channel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk",
    "pydantic>=2",
    "python-dotenv",
    "pymupdf",
    "python-docx",
    "Pillow",
    "pytesseract",
    "segno",
]

[project.scripts]
designcraft-brochure = "designcraft_brochure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
