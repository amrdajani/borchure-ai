[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brochure-agent"
version = "0.1.0"
description = "Jev-directed brochure agent that operates Adobe InDesign through the Windows interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk",
    "pydantic>=2",
    "python-dotenv",
    "pymupdf",
    "python-docx",
    "Pillow",
    "pyautogui",
    "pywinauto",
    "pytesseract",
]

[project.scripts]
brochure-agent = "brochure_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
